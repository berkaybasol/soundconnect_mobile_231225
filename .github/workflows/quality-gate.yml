name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Run Quality Gate
        run: dart run tool/quality_gate.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  native-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - name: Prepare direct Gradle dependencies and Linux SDK paths
        run: |
          flutter precache --android
          flutter pub get
          # Flutter normally injects these ignored wrapper files during flutter build.
          test -f android/gradlew || cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar || cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          mkdir -p build/native-ci
      - name: Verify native report parsers and existing APK verifier
        run: |
          python3 tool/test_native_gate.py
          pwsh -NoProfile -File tool/bridge_harness/test_verify_apks.ps1 -EvidenceDirectory build/native-ci/apk-parser
          pwsh -NoProfile -File tool/bridge_harness/test_runner_report.ps1 -EvidenceDirectory build/native-ci/runner-parser
      - name: Full native JVM inventory (including clock and time contract suites)
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -I ../tool/native-tests.gradle --no-daemon --console=plain -Ptarget-platform=android-x64 :app:testDebugUnitTest 2>&1 | tee ../build/native-ci/jvm.log
          cd ..
          python3 tool/native_gate.py jvm --reports build/app/test-results/testDebugUnitTest --events build/native-ci/jvm.log
      - name: Normal product push disabled build and APK gate
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --console=plain -Ptarget-platform=android-x64 -Ptarget=lib/main.dart -Pdart-defines=U09VTkRDT05ORUNUX1BVU0hfRU5BQkxFRD1mYWxzZQ== :app:assembleDebug 2>&1 | tee ../build/native-ci/push-off-build.log
          cd ..
          python3 tool/native_gate.py product --push false --apk build/app/outputs/apk/debug/app-debug.apk --manifest build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output build/native-ci/push-off
      - name: Synthetic build-only Firebase configuration (normal Google Services plugin)
        run: python3 tool/native_gate.py firebase
      - name: Normal product push enabled build and APK gate
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --console=plain -Ptarget-platform=android-x64 -Ptarget=lib/main.dart -Pdart-defines=U09VTkRDT05ORUNUX1BVU0hfRU5BQkxFRD10cnVl :app:assembleDebug 2>&1 | tee ../build/native-ci/push-on-build.log
          cd ..
          python3 tool/native_gate.py product --push true --apk build/app/outputs/apk/debug/app-debug.apk --manifest build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output build/native-ci/push-on
      - name: Preserve native build and test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-reports-build-only
          path: |
            build/native-ci/
            build/app/test-results/testDebugUnitTest/
            build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7

  native-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - name: Prepare isolated warmtest APKs
        shell: bash
        run: |
          set -o pipefail
          flutter precache --android
          flutter pub get
          test -f android/gradlew || cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar || cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          mkdir -p build/native-ci/apks
          cd android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --console=plain -Ptarget-platform=android-x64 -PsoundconnectBridgeHarness=true -Ptarget=integration_test/native_push_bridge_harness.dart -Pdart-defines=U09VTkRDT05ORUNUX1BVU0hfRU5BQkxFRD10cnVl :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee ../build/native-ci/harness-build.log
          cd ..
          cp build/app/outputs/apk/debug/app-debug.apk build/native-ci/apks/warmtest.apk
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/native-ci/apks/warmtest-test.apk
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exact hosted emulator and reviewed method inventory
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: pwsh -NoProfile -File tool/bridge_harness/run_hosted.ps1 -Serial emulator-5554 -AppApk build/native-ci/apks/warmtest.apk -TestApk build/native-ci/apks/warmtest-test.apk -Aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" -EvidenceDirectory build/native-ci/hosted
      - name: Preserve isolated instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-instrumentation-reports
          path: |
            build/native-ci/*.log
            build/native-ci/hosted/
          if-no-files-found: error
          retention-days: 7
